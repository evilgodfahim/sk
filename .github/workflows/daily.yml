name: Daily Monitor

on:
  schedule:
    - cron: "0 18 * * *"   # 12 AM Bangladesh time (UTC+6)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install feedparser requests

      - name: Run script
        run: python fetch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add *.html
          git commit -m "Update page" || exit 0
          git push
